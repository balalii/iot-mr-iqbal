name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/iot-mr-iqbal

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          # Dipakai untuk filter `docker image prune` di VPS supaya tidak menyentuh image project lain
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Nilai publik (bukan rahasia) -> GitHub repo "Variables"
          build-args: |
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      # docker-compose.yml + .env ditaruh manual sekali di DEPLOY_PATH
      - name: Pull & restart container
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_IMAGE: ${{ env.IMAGE }}:${{ github.sha }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/home/vo1d/iot-mr-iqbal' }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: GHCR_USER,GHCR_TOKEN,APP_IMAGE,DEPLOY_PATH,REPO_URL
          script: |
            set -e
            cd "$DEPLOY_PATH"
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            export APP_IMAGE
            docker compose pull
            docker compose up -d --remove-orphans
            docker logout ghcr.io
            # Hanya hapus image lama milik repo ini, bukan image project lain di VPS
            docker image prune -f --filter "label=org.opencontainers.image.source=$REPO_URL"

            # Tunggu app siap (migrasi Prisma jalan dulu saat container start)
            for i in $(seq 1 60); do
              docker compose exec -T app node -e "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))" \
                && { echo "iot-mr-iqbal ${APP_IMAGE} ready"; exit 0; }
              sleep 2
            done
            echo "iot-mr-iqbal tidak healthy" >&2
            docker compose logs --tail 100 app
            exit 1
